# CI/CD van Bliep, voor de demo "van development naar productie".
#
#   pull request naar development, staging of main  ->  alleen de tests (CI)
#   merge (push) op development, staging of main     ->  tests, dan image bouwen en pushen
#
# Welk image-label hoort bij welke branch?
#   development -> :development    staging -> :staging    main -> :production
# Komodo volgt die labels per omgeving en rolt uit zodra er een nieuw image is.
# Faalt een test, dan wordt er niets gebouwd, en heeft Komodo niets nieuws.

name: CI/CD

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests van de webshop
        working-directory: webshop
        run: |
          npm ci
          npm test

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Welk label hoort bij deze branch?
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "LABEL=production" >> "$GITHUB_ENV" ;;
            *)    echo "LABEL=${GITHUB_REF_NAME}" >> "$GITHUB_ENV" ;;
          esac
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bliep-web" >> "$GITHUB_ENV"
          echo "KORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: webshop
          push: true
          build-args: GIT_COMMIT=${{ env.KORT }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ env.LABEL }}
            ${{ env.IMAGE }}:${{ env.KORT }}
